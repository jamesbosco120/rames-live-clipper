name: Diag secrets (temporaire)
on:
  push:
    branches: [claude/diag-secrets]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          U: ${{ secrets.RAMES_DRIVE_RELAY_URL }}
          K: ${{ secrets.RAMES_DRIVE_RELAY_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          u, k = os.environ["U"].strip(), os.environ["K"].strip()
          print("§ URL forme script.google.com/.../exec :", u.startswith("https://script.google.com/") and u.endswith("/exec"))
          print("§ URL ressemble à une clé (hexa) :", all(c in "0123456789abcdef" for c in u) and len(u) > 20)
          print("§ KEY longueur :", len(k), "| hexa :", all(c in "0123456789abcdef" for c in k))
          print("§ URL == KEY :", u == k)
          try:
              r = urllib.request.urlopen(urllib.request.Request(u, data=json.dumps({"type": "demo-consignes", "key": k}).encode(), headers={"Content-Type": "application/json"}), timeout=60)
              rep = json.loads(r.read().decode() or "{}")
              print("§ relais ok :", rep.get("ok"), "| erreur :", str(rep.get("error"))[:80] if not rep.get("ok") else "-")
          except Exception as x:
              print("§ relais injoignable :", type(x).__name__)
          PY
