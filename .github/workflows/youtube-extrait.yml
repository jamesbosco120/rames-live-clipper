# Lanceur PUBLIC de « YouTube – extrait » (21/11/2026, demande de James : plus aucune limite de minutes).
# Même modèle de sécurité que « Rafale – file » : horloge de GitHub ou lancement par le propriétaire seulement,
# aucune pull request ne lance rien ; code, clés et réglages restent dans le dépôt PRIVÉ (lu avec PRIVE_TOKEN) ;
# journal public filtré (lignes « § » seulement), aucun artifact.
name: YouTube – extrait

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Lien YouTube"
        required: true
      projet:
        description: "Nom court (ex. 2026-11-22_gta6-trailer)"
        required: false
        default: extrait
      debut:
        description: "Début HH:MM:SS (facultatif)"
        required: false
        default: ""
      fin:
        description: "Fin HH:MM:SS (facultatif)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: youtube-extrait
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code privé (clé cachée)
        uses: actions/checkout@v4
        with:
          repository: jamesbosco120/rames-clip-factory
          token: ${{ secrets.PRIVE_TOKEN }}
          path: prive

      - name: Passage (journal filtré)
        id: passage
        working-directory: prive
        env:
          PRIVE_TOKEN: ${{ secrets.PRIVE_TOKEN }}
          BRAIN_TOKEN: ${{ secrets.BRAIN_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BOITE_MOT_DE_PASSE: ${{ secrets.BOITE_MOT_DE_PASSE }}
          RAMES_DRIVE_RELAY_URL: ${{ secrets.RAMES_DRIVE_RELAY_URL }}
          RAMES_DRIVE_RELAY_KEY: ${{ secrets.RAMES_DRIVE_RELAY_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_URL: ${{ inputs.url }}
          PROJET: ${{ inputs.projet }}
          DEBUT: ${{ inputs.debut }}
          FIN: ${{ inputs.fin }}

        run: |
          set +e
          test -f scripts/public/youtube-extrait.sh || { echo "❌ Code privé inaccessible (PRIVE_TOKEN ?)"; exit 1; }
          bash scripts/public/youtube-extrait.sh > "$RUNNER_TEMP/detail.log" 2>&1
          code=$?
          grep '^§ ' "$RUNNER_TEMP/detail.log"
          rm -f "$RUNNER_TEMP/detail.log"
          [ $code -eq 0 ] && echo "✅ Terminé" || echo "❌ Échec (code $code) : détails gardés privés"
          exit $code

      - name: Alerte si 2 échecs de suite (ntfy)
        if: always()
        working-directory: prive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash scripts/public/alerte-echecs.sh youtube-extrait.yml "YouTube – extrait" "${{ steps.passage.outcome }}" || true
      - name: Ménage
        if: always()
        run: rm -rf prive "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/brain
