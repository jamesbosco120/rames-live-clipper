# rames-live-clipper — DÉMO CLIENT : veille des chaînes à démarcher (demande de James du 18/11/2026).
# Toutes les 10 min : lit les consignes « DEMO : chaîne » du QG (relais Drive, clé cachée), regarde si la chaîne est en
# live (lecture publique Twitch, sans compte) et lance « Démo client – en direct » (1 seul à la fois par chaîne).
# Dépôt public = minutes GitHub illimitées. Journal filtré : jamais le nom de la chaîne, ni lien, ni clé (lignes « § »).
name: Démo client – veille

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Code privé (lecture seule, clé cachée)
        uses: actions/checkout@v4
        with:
          repository: jamesbosco120/rames-clip-factory
          token: ${{ secrets.PRIVE_TOKEN }}
          path: prive
          persist-credentials: false
          sparse-checkout: |
            factory
            publication/demo
            publication/live/criteres.json
            templates/modeles
            run.py
            config.yaml
            requirements.txt
      - name: Veille (journal filtré)
        working-directory: prive
        env:
          LIVE_PUBLIC: "1"
          PRIVE_TOKEN: ${{ secrets.PRIVE_TOKEN }}
          RAMES_DRIVE_RELAY_URL: ${{ secrets.RAMES_DRIVE_RELAY_URL }}
          RAMES_DRIVE_RELAY_KEY: ${{ secrets.RAMES_DRIVE_RELAY_KEY }}
        run: |
          set +e
          pip install -q numpy pyyaml >/dev/null 2>&1
          python -c "from factory import demo; demo.veille()" > "$RUNNER_TEMP/veille.log" 2>&1; code=$?
          grep '^§ ' "$RUNNER_TEMP/veille.log"
          rm -f "$RUNNER_TEMP/veille.log"
          [ $code -eq 0 ] || echo "❌ veille arrêtée (code $code) : détails gardés privés"
          exit $code
      - name: Ménage
        if: always()
        run: rm -rf prive
