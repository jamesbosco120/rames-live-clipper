# Lanceur PUBLIC de « Rafale – stats du matin » (21/11/2026, demande de James : plus aucune limite de minutes).
# Même modèle de sécurité que « Rafale – file » : horloge de GitHub ou lancement par le propriétaire seulement,
# aucune pull request ne lance rien ; code, clés et réglages restent dans le dépôt PRIVÉ (lu avec PRIVE_TOKEN) ;
# journal public filtré (lignes « § » seulement), aucun artifact.
name: Rafale – stats du matin

on:
  schedule:
    - cron: "7 6 * * *"
    - cron: "7 7 * * *"   # rattrapage : passe son tour si le relevé du jour a réussi
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rafale-stats
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Code privé (clé cachée)
        uses: actions/checkout@v4
        with:
          repository: jamesbosco120/rames-clip-factory
          token: ${{ secrets.PRIVE_TOKEN }}
          path: prive
      - name: Déjà fait aujourd hui ? (rattrapage)
        id: deja
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.schedule }}" = "7 7 * * *" ]; then
            N=$(gh run list -R "${{ github.repository }}" -w rafale-stats.yml -s success --created ">=$(date -u +%F)" --json databaseId --jq length)
            [ "${N:-0}" -gt 0 ] && { echo "✅ Relevé du jour déjà fait."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Passage (journal filtré)
        id: passage
        if: steps.deja.outputs.go == 'true'
        working-directory: prive
        env:
          PRIVE_TOKEN: ${{ secrets.PRIVE_TOKEN }}
          BRAIN_TOKEN: ${{ secrets.BRAIN_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BOITE_MOT_DE_PASSE: ${{ secrets.BOITE_MOT_DE_PASSE }}
          RAMES_DRIVE_RELAY_URL: ${{ secrets.RAMES_DRIVE_RELAY_URL }}
          RAMES_DRIVE_RELAY_KEY: ${{ secrets.RAMES_DRIVE_RELAY_KEY }}

        run: |
          set +e
          test -f scripts/public/stats-matin.sh || { echo "❌ Code privé inaccessible (PRIVE_TOKEN ?)"; exit 1; }
          bash scripts/public/stats-matin.sh > "$RUNNER_TEMP/detail.log" 2>&1
          code=$?
          grep '^§ ' "$RUNNER_TEMP/detail.log"
          rm -f "$RUNNER_TEMP/detail.log"
          [ $code -eq 0 ] && echo "✅ Terminé" || echo "❌ Échec (code $code) : détails gardés privés"
          exit $code

      - name: Alerte si 2 échecs de suite (ntfy)
        if: always()
        working-directory: prive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash scripts/public/alerte-echecs.sh rafale-stats.yml "Rafale – stats du matin" "${{ steps.passage.outcome }}" || true
      - name: Ménage
        if: always()
        run: rm -rf prive "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/brain
