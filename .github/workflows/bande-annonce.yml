# Lanceur PUBLIC de « Bande-annonce – rendu et Drive » (22/11/2026, bande-annonce Twitch V2 de RamesRD).
# Même modèle de sécurité que « YouTube – extrait » : lancement à la main par le propriétaire seulement, aucune pull
# request ne lance rien ; code, montage, clés et réglages restent dans le dépôt PRIVÉ (lu avec PRIVE_TOKEN) ;
# journal public filtré (lignes « § » seulement), aucun artifact. Rien n'est publié sur les réseaux.
name: Bande-annonce – rendu et Drive

on:
  workflow_dispatch:
    inputs:
      nom:
        description: "Nom du fichier dans Drive (exports)"
        required: true
        default: BANDE-ANNONCE_twitch_2026-11-22_v2.mp4

permissions:
  contents: read

concurrency:
  group: bande-annonce
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Code privé (clé cachée)
        uses: actions/checkout@v4
        with:
          repository: jamesbosco120/rames-clip-factory
          token: ${{ secrets.PRIVE_TOKEN }}
          path: prive

      - name: Passage (journal filtré)
        working-directory: prive
        env:
          RAMES_DRIVE_RELAY_URL: ${{ secrets.RAMES_DRIVE_RELAY_URL }}
          RAMES_DRIVE_RELAY_KEY: ${{ secrets.RAMES_DRIVE_RELAY_KEY }}
          NOM: ${{ inputs.nom }}
        run: |
          set +e
          test -f scripts/public/bande-annonce.sh || { echo "❌ Code privé inaccessible (PRIVE_TOKEN ?)"; exit 1; }
          bash scripts/public/bande-annonce.sh > "$RUNNER_TEMP/detail.log" 2>&1
          code=$?
          grep '^§ ' "$RUNNER_TEMP/detail.log"
          rm -f "$RUNNER_TEMP/detail.log"
          [ $code -eq 0 ] && echo "✅ Terminé" || echo "❌ Échec (code $code) : détails gardés privés"
          exit $code

      - name: Ménage
        if: always()
        run: rm -rf prive "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/ba
