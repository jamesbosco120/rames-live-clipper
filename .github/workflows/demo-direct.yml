# rames-live-clipper — DÉMO CLIENT : clips en direct du live d'un AUTRE streamer (demande de James du 18/11/2026).
# Lancé par « Démo client – veille » (ou à la main). JAMAIS publié : clips rangés dans Drive « Démos clients », rapport
# au QG. Le live n'est jamais gardé (tampon de la fenêtre en cours, effacé au fur et à mesure), jamais de rediffusion.
# Journal filtré (lignes « § ») : jamais le nom de la chaîne, ni lien, ni score, ni pseudo du chat, ni clé.
name: Démo client – en direct
run-name: "Démo client · ${{ inputs.repere }}"

on:
  workflow_dispatch:
    inputs:
      chaine:
        description: "Chaîne Twitch (nom seul, ex. nomdelachaine)"
        required: true
      repere:
        description: "Repère anonyme (rempli par la veille)"
        default: manuel

permissions:
  contents: read

concurrency:
  group: demo-${{ inputs.repere }}
  cancel-in-progress: false

jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Masque le nom de la chaîne dans le journal
        env:
          CHAINE: ${{ inputs.chaine }}
        run: echo "::add-mask::$CHAINE"
      - name: Code privé (lecture seule, clé cachée)
        uses: actions/checkout@v4
        with:
          repository: jamesbosco120/rames-clip-factory
          token: ${{ secrets.PRIVE_TOKEN }}
          path: prive
          persist-credentials: false
      - name: Outils (ffmpeg, transcription)
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q -r prive/requirements.txt >/dev/null 2>&1
          echo "✅ Outils prêts"
      - name: Démo en direct (journal filtré)
        working-directory: prive
        env:
          LIVE_PUBLIC: "1"
          CHAINE: ${{ inputs.chaine }}
          RAMES_DRIVE_RELAY_URL: ${{ secrets.RAMES_DRIVE_RELAY_URL }}
          RAMES_DRIVE_RELAY_KEY: ${{ secrets.RAMES_DRIVE_RELAY_KEY }}
        run: |
          set +e
          # 6 h max par lancement (limite GitHub) : arrêt propre à 345 min, la veille relance si le live continue
          python run.py demo direct "$CHAINE" --duree-max 345 > "$RUNNER_TEMP/demo.log" 2>&1 &
          pid=$!
          tail -n +1 -F "$RUNNER_TEMP/demo.log" 2>/dev/null | grep --line-buffered '^§ ' &
          wait $pid; code=$?
          sleep 2; pkill -f "tail -n +1 -F" || true
          rm -f "$RUNNER_TEMP/demo.log"
          [ $code -eq 0 ] && echo "✅ Fin de la démo" || echo "❌ La démo s'est arrêtée (code $code) : détails gardés privés"
          exit $code
      - name: Ménage
        if: always()
        run: rm -rf prive "$RUNNER_TEMP"/*.log
