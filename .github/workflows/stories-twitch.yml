# Lanceur PUBLIC de « Stories Twitch – pack du jour » (21/11/2026, demande de James : 3 stories Twitch par jour minimum).
# Twitch n'a pas d'API pour publier une story : chaque matin on PRÉPARE 3 à 5 vidéos (≤ 60 s) dans Drive et on programme
# 3 rappels ntfy (12 h, 18 h, 21 h heure de France) ; James poste depuis l'appli Twitch.
# Même modèle de sécurité que les autres lanceurs : horloge de GitHub ou lancement par le propriétaire seulement, aucune pull
# request ne lance rien ; code, file et clés restent privés (lus avec PRIVE_TOKEN) ; journal filtré (« § »), aucun artifact.
name: Stories Twitch – pack du jour

on:
  schedule:
    - cron: "23 9 * * *"        # 10 h 23 heure de France (hiver), avant le 1er rappel de 12 h
  workflow_dispatch:
    inputs:
      essai:
        description: "oui = fabrique sans rien envoyer (ni Drive, ni ntfy, ni carte)"
        type: choice
        options: ["non", "oui"]
        default: "non"

permissions:
  contents: read
  actions: read

concurrency:
  group: stories-twitch
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Code privé (clé cachée)
        uses: actions/checkout@v4
        with:
          repository: jamesbosco120/rames-clip-factory
          token: ${{ secrets.PRIVE_TOKEN }}
          path: prive

      - name: Pack du jour (journal filtré)
        id: passage
        working-directory: prive
        env:
          PRIVE_TOKEN: ${{ secrets.PRIVE_TOKEN }}
          BRAIN_TOKEN: ${{ secrets.BRAIN_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RAMES_DRIVE_RELAY_URL: ${{ secrets.RAMES_DRIVE_RELAY_URL }}
          RAMES_DRIVE_RELAY_KEY: ${{ secrets.RAMES_DRIVE_RELAY_KEY }}
          ESSAI: ${{ inputs.essai == 'oui' && '1' || '0' }}
        run: |
          set +e
          test -f scripts/public/stories-twitch.sh || { echo "❌ Code privé inaccessible (PRIVE_TOKEN ?)"; exit 1; }
          bash scripts/public/stories-twitch.sh > "$RUNNER_TEMP/detail.log" 2>&1
          code=$?
          grep '^§ ' "$RUNNER_TEMP/detail.log"
          rm -f "$RUNNER_TEMP/detail.log"
          [ $code -eq 0 ] && echo "✅ Terminé" || echo "❌ Échec (code $code) : détails gardés privés"
          exit $code

      - name: Alerte si 2 échecs de suite (ntfy)
        if: always()
        working-directory: prive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash scripts/public/alerte-echecs.sh stories-twitch.yml "Stories Twitch" "${{ steps.passage.outcome }}" || true
      - name: Ménage
        if: always()
        run: rm -rf prive "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/brain "$RUNNER_TEMP"/stories
