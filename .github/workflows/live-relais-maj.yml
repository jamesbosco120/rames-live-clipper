# Lanceur PUBLIC de « Live – relais : mise en ligne » (21/11/2026). Le dépôt privé ne peut plus lancer d'Actions
# (forfait de minutes) : ce lanceur envoie le relais Cloudflare « live-relais » (passage en live + sondages Twitch).
# Les secrets déjà posés dans le relais restent (wrangler ne les touche pas). Si le secret TWITCH_CLIENT_ID existe dans
# CE dépôt, il est recopié dans le relais (nécessaire aux sondages) ; sinon le journal le signale.
# Sécurité : lancement par le propriétaire seulement ; code privé (PRIVE_TOKEN) ; journal filtré (« § »), aucun artifact.
name: "Live – relais : mise en ligne"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-relais-maj
  cancel-in-progress: false

jobs:
  envoi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Code privé (clé cachée)
        uses: actions/checkout@v4
        with:
          repository: jamesbosco120/rames-clip-factory
          token: ${{ secrets.PRIVE_TOKEN }}
          path: prive
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests puis envoi (journal filtré)
        working-directory: prive/publication/live/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          set +e
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -n "${!v}" ] || { echo "§ ❌ secret $v absent de ce dépôt public"; exit 1; }; done
          node --test test.mjs test-sondage.mjs > /dev/null 2>&1 || { echo "§ ❌ tests du relais en échec : rien envoyé"; exit 1; }
          echo "§ ✅ tests verts"
          npx -y wrangler@4 deploy > "$RUNNER_TEMP/d.log" 2>&1; code=$?
          rm -f "$RUNNER_TEMP/d.log"
          [ $code -eq 0 ] && echo "§ ✅ relais envoyé sur Cloudflare" || { echo "§ ❌ envoi refusé par Cloudflare (code $code)"; exit 1; }
          if [ -n "$TWITCH_CLIENT_ID" ]; then
            printf %s "$TWITCH_CLIENT_ID" | npx -y wrangler@4 secret put TWITCH_CLIENT_ID > /dev/null 2>&1 \
              && echo "§ ✅ ID client Twitch posé dans le relais" || echo "§ ❌ ID client Twitch pas posé"
          fi
          sleep 5
          # 23/11 : on fige d'abord les clés (touches Stream Deck + EventSub) avec l'ANCIEN secret encore en place,
          # puis seulement on pose le nouveau secret de l'appli Twitch (s'il est dans ce dépôt).
          curl -s -o /dev/null "https://live-relais.jamesbosco120.workers.dev/sondage?k=fige"
          if [ -n "$TWITCH_CLIENT_SECRET" ]; then
            printf %s "$TWITCH_CLIENT_SECRET" | npx -y wrangler@4 secret put TWITCH_CLIENT_SECRET > /dev/null 2>&1 \
              && echo "§ ✅ nouveau secret de l'appli Twitch posé dans le relais (clés des touches inchangées)" || echo "§ ❌ secret Twitch pas posé"
            sleep 8
          fi
          curl -s https://live-relais.jamesbosco120.workers.dev/ | grep -q "live-relais OK" && echo "§ ✅ le relais répond" || { echo "§ ❌ le relais ne répond pas"; exit 1; }
          p=$(curl -s https://live-relais.jamesbosco120.workers.dev/twitch/autoriser)
          if echo "$p" | grep -q "Autoriser sur Twitch"; then echo "§ ✅ page d'autorisation des sondages prête"
          else echo "§ ⚠ sondages pas prêts : $(echo "$p" | grep -o '❌ [^<]*' | head -1 | cut -c1-160)"; fi
      - name: Ménage
        if: always()
        run: rm -rf prive
