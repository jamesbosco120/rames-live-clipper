# Lanceur PUBLIC de « Live – clip » (23/11/2026) : montage + dépôt FILE RAFALE d'UN moment choisi pendant le live.
# Copie du robot du dépôt privé (bloqué : minutes épuisées depuis le 20/11). Lancé par l'outil 1 (« Live – en direct »)
# avec le jeton de l'Action. Code, critères et clés restent PRIVÉS (lus avec PRIVE_TOKEN) ; journal filtré « § » ;
# aucune vidéo gardée ici (pas d'artifact).
name: Live – clip
run-name: "Live – clip"

on:
  workflow_dispatch:
    inputs:
      vod: { description: "Identifiant de la rediffusion en cours", required: true }
      pic: { description: "Moment fort (secondes dans la rediffusion, vide = aucun)", required: false, default: "" }
      score: { description: "Score de viralité", required: false, default: "0" }
      fenetre_debut: { description: "Début de la fenêtre de 45 min (UTC, ISO)", required: false, default: "" }
      fenetre_fin: { description: "Fin de la fenêtre de 45 min (UTC, ISO)", required: false, default: "" }

permissions:
  contents: read

concurrency:
  group: live-clip
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Code privé (clé cachée)
        uses: actions/checkout@v4
        with:
          repository: jamesbosco120/rames-clip-factory
          token: ${{ secrets.PRIVE_TOKEN }}
          path: prive
          persist-credentials: false
      - name: Montage + dépôt (journal filtré)
        working-directory: prive
        env:
          LIVE_PUBLIC: "1"
          VOD: ${{ inputs.vod }}
          LIVE_PIC: ${{ inputs.pic }}
          LIVE_SCORE: ${{ inputs.score }}
          LIVE_FEN_DEBUT: ${{ inputs.fenetre_debut }}
          LIVE_FEN_FIN: ${{ inputs.fenetre_fin }}
          BRAIN_TOKEN: ${{ secrets.BRAIN_TOKEN }}
          RAMES_DRIVE_RELAY_URL: ${{ secrets.RAMES_DRIVE_RELAY_URL }}
          RAMES_DRIVE_RELAY_KEY: ${{ secrets.RAMES_DRIVE_RELAY_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          set +e
          test -f scripts/public/live-clip.sh || { echo "❌ Code privé inaccessible (PRIVE_TOKEN ?)"; exit 1; }
          bash scripts/public/live-clip.sh > "$RUNNER_TEMP/detail.log" 2>&1
          code=$?
          grep '^§ ' "$RUNNER_TEMP/detail.log"
          rm -f "$RUNNER_TEMP/detail.log"
          [ $code -eq 0 ] && echo "✅ Terminé" || echo "❌ Échec (code $code) : détails gardés privés"
          exit $code
      - name: Ménage
        if: always()
        run: rm -rf prive "$RUNNER_TEMP"/brain
