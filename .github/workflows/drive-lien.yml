# Lanceur PUBLIC de « Drive – vidéo depuis la vitrine » (22/11/2026, film Rafale v4). La session Claude n'a pas le relais
# Drive et le connecteur Drive refuse les fichiers de plus de ~3 Mo : une vidéo déjà en ligne sur une vitrine RAMES
# (https://(apercu.)rames-<site>.pages.dev/…mp4, rien d'autre) est copiée dans Drive « Claude montage/exports ».
# Même modèle de sécurité que « Bande-annonce – rendu et Drive » : lancement à la main par le propriétaire seulement,
# aucune pull request ne lance rien ; code et clés restent privés (lus avec PRIVE_TOKEN) ; journal filtré « § », aucun artifact.
name: Drive – vidéo depuis la vitrine

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse de la vidéo (https://apercu.rames-rafale.pages.dev/assets/….mp4)"
        required: true
      nom:
        description: "Nom du fichier dans Drive (exports), .mp4"
        required: true

permissions:
  contents: read

concurrency:
  group: drive-lien
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Code privé (clé cachée)
        uses: actions/checkout@v4
        with:
          repository: jamesbosco120/rames-clip-factory
          token: ${{ secrets.PRIVE_TOKEN }}
          path: prive
          persist-credentials: false

      - name: Passage (journal filtré)
        working-directory: prive
        env:
          RAMES_DRIVE_RELAY_URL: ${{ secrets.RAMES_DRIVE_RELAY_URL }}
          RAMES_DRIVE_RELAY_KEY: ${{ secrets.RAMES_DRIVE_RELAY_KEY }}
          URL: ${{ inputs.url }}
          NOM: ${{ inputs.nom }}
        run: |
          set +e
          test -f scripts/public/drive-lien.sh || { echo "❌ Code privé inaccessible (PRIVE_TOKEN ?)"; exit 1; }
          bash scripts/public/drive-lien.sh > "$RUNNER_TEMP/detail.log" 2>&1
          code=$?
          grep '^§ ' "$RUNNER_TEMP/detail.log"
          rm -f "$RUNNER_TEMP/detail.log"
          [ $code -eq 0 ] && echo "✅ Terminé" || echo "❌ Échec (code $code) : détails gardés privés"
          exit $code

      - name: Ménage
        if: always()
        run: rm -rf prive "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/dl
